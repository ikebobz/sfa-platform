version: "3.9"

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    # Real secrets (JWT keys, DB credentials, CORS origin) come from .env — see
    # .env.example. Do not hardcode them here; this file is meant to be safe to
    # commit even though .env itself never should be.
    env_file:
      - .env
    environment:
      # The Dockerfile's default build target is its production stage (no dev
      # target exists), so this must always say production — the compiled
      # dist/ output and knexfile.js's production branch both depend on it.
      NODE_ENV: production
      # Inside the Docker network the DB host is the service name below, not
      # whatever DB_HOST is set to in .env for local (non-Docker) development.
      DB_HOST: mariadb
      DB_PORT: 3306
    ports:
      - "4000:4000"

volumes:
  mariadb_data:
